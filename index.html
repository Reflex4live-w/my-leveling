<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/todo.css">
  <link rel="stylesheet" href="css/banner.css">
  <link rel="stylesheet" href="css/nav.css">
  <title>Document</title>
</head>
<body>
  <main>
    <div id="nav"></div>
    <div id="main">
      <div id="banner">
        <div id="banner-main">
          <div id="banner-main-content">
            <div id="profile">
              <div id="avatar">
                <img src="img/avatar.jpeg" id="avatar-img">
              </div>
              <div id="nickname">reflex4live</div>
            </div>
            <div id="block-center"></div>
            <div id="date-and-time">
              <div id="time"></div>
              <div id="date"></div>
            </div>
            <div id="dota-rang">
              <div id="rang"></div>
              <input id="dota-input" type="text">
            </div>
          </div>
          <div id="banner-main-links">
            <div class="link"></div>
            <div class="link"></div>
            <div class="link"></div>
            <div class="link"></div>
          </div>

        </div>
        <div id="countdown-block">
          <div class="countdown"></div>
          <div class="countdown"></div>
          <div class="countdown"></div>

        </div>
      </div>
      <div id="apps">
        <div class="todo" id="todo">
          <form id="todo-form" autocomplete="off">
            <label for="todo-input">Task</label>
            <input id="todo-input" type="text" placeholder="Add task...">
            <button id="button-add" class="button__input" type="submit">Add</button>
          </form>
          <div class="columns">
            <div class="column" id="column-now">
              <h2>Now</h2>
              <ul id="list-now"></ul>
            </div>
            <div class="column" id="column-later">
              <h2>Later</h2>
              <ul id="list-later"></ul>
            </div>
          </div>
        </div>
        <div id="counters">

        </div>
      </div>
    </div>

  </main>
  <script src="js/todo.js"></script>
  <script src="js/index.js"></script>
  <script src="js/banner.js"></script>
</body>
</html>
